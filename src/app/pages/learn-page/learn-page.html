<app-page-shell>
  <main shellMain>
    <header class="page-header text-center">
      <h1 class="page-header__title">Learn</h1>
      <p class="page-header__subtitle text-muted mb-0">{{ hubCopy.subtitle }}</p>
    </header>

    <app-learn-roadmap />

    <div class="learn-tracks row g-4 mb-4">
      <div class="col-lg-4">
        <app-learn-track-list trackId="foundation" />
      </div>
      <div class="col-lg-4">
        <app-learn-track-list trackId="llm-systems" />
      </div>
      <div class="col-lg-4">
        <app-learn-track-list trackId="systems-production" />
      </div>
    </div>

    <section class="learn-tools card-elevated mb-4" aria-label="Tools">
      <h2 class="h6 learn-tools__title">Tools</h2>
      <a class="learn-tools__link" routerLink="/evaluations/new">{{ hubCopy.toolsLabel }} →</a>
    </section>
  </main>

  <nav shellRight class="learn-hub-nav card-elevated" aria-label="Learn shortcuts">
    @if (nextLesson(); as next) {
      <a class="btn btn-primary btn-sm" [routerLink]="next.route">Continue →</a>
    } @else {
      <span class="badge text-bg-success">Path complete</span>
    }
    <a class="btn btn-outline-secondary btn-sm" routerLink="/">Dashboard</a>
  </nav>
</app-page-shell>
