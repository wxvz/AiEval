<div class="row justify-content-center">
  <div class="col-lg-8">
    <header class="page-header text-center">
      <h1 class="page-header__title">Learn</h1>
      <p class="page-header__subtitle text-muted mb-0">
        Short, hands-on topics. Pick one to explore at your own pace.
      </p>
    </header>

    <div class="learn-topics">
      @for (topic of topics; track topic.title) {
        @if (topic.route) {
          <a class="learn-topic card-elevated" [routerLink]="topic.route">
            <span class="learn-topic__badge">{{ topic.badge }}</span>
            <h2 class="learn-topic__title">{{ topic.title }}</h2>
            <p class="learn-topic__description">{{ topic.description }}</p>
            <span class="learn-topic__cta">Open topic →</span>
          </a>
        } @else {
          <div class="learn-topic learn-topic--soon card-elevated" aria-disabled="true">
            <span class="learn-topic__badge learn-topic__badge--muted">{{ topic.badge }}</span>
            <h2 class="learn-topic__title">{{ topic.title }}</h2>
            <p class="learn-topic__description">{{ topic.description }}</p>
          </div>
        }
      }
    </div>
  </div>
</div>
