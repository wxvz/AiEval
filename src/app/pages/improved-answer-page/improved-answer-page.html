@if (!evaluation()) {
  <app-empty-state title="Evaluation not found" message="Return to the dashboard and try again." />
} @else {
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Improved answer: {{ evaluation()!.title }}</h1>
    @if (automating()) {
      <span class="btn btn-outline-secondary btn-sm disabled" aria-disabled="true">Back to edit</span>
    } @else {
      <a class="btn btn-outline-secondary btn-sm" [routerLink]="['/evaluations', evaluationId, 'edit']">Back to edit</a>
    }
  </div>

  @if (!hasWinner()) {
    <p class="text-muted small mb-3">
      Mark a winner on the
      <a [routerLink]="['/evaluations', evaluationId, 'compare']">compare page</a>
      or run auto-score before generating an improved answer.
    </p>
  } @else {
    <div class="mb-4">
      <app-automation-controls
        [evaluationId]="evaluationId"
        phase="improved"
        buttonLabel="Generate improved answer"
        runningLabel="Generating improved answer…"
        statusHint="Drafting an improved answer based on the winning response."
        successMessage="Improved answer generated."
        errorMessage="Could not generate improved answer."
        confirmForceTitle="Replace improved answer?"
        confirmForceMessage="Replace the existing improved answer with a newly generated draft?"
        confirmForceLabel="Replace and generate"
      />
    </div>
  }

  <app-improved-answer-editor
    [value]="evaluation()!.improvedAnswer"
    [answers]="evaluation()!.answers"
    [winnerAnswerId]="evaluation()!.winnerAnswerId"
    (saved)="onSave($event)"
  />

  <app-leave-during-automation [evaluationId]="evaluationId" />
}
