<header class="page-header d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3">
  <div>
    <h1 class="page-header__title">Evaluations</h1>
    <p class="page-header__subtitle">Compare AI answers side by side.</p>
  </div>
  <a routerLink="/evaluations/new" class="btn btn-primary px-4">New Evaluation</a>
</header>

@if (loading()) {
  <app-loading-spinner message="Loading evaluations..." />
} @else if (loadError()) {
  <div class="alert alert-danger" role="alert">{{ loadError() }}</div>
} @else if (evaluations().length === 0) {
  <app-empty-state
    title="No evaluations yet"
    message="Create an evaluation to compare AI answers side by side."
    actionLabel="New Evaluation"
    actionLink="/evaluations/new"
  />
} @else {
  <div class="row g-4">
    @for (evaluation of evaluations(); track evaluation.id) {
      <div class="col-md-6 col-xl-4">
        <app-evaluation-card [evaluation]="evaluation" (deleteRequested)="requestDelete($event)" />
      </div>
    }
  </div>
}

<app-confirm-delete-modal
  modalId="deleteEvaluationModal"
  title="Delete evaluation"
  message="This will permanently remove the evaluation and all of its answers."
  (confirmed)="confirmDelete()"
/>
