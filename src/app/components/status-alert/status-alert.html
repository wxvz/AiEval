@if (feedbackService.feedback(); as feedback) {
  <div
    class="toast-alert alert mb-0"
    [class.alert-success]="feedback.type === 'success'"
    [class.alert-danger]="feedback.type === 'danger'"
    [class.toast-exit]="feedbackService.exiting()"
    role="alert"
  >
    {{ feedback.message }}
  </div>
}
