<form [formGroup]="form" (ngSubmit)="onSave()">
  <div class="mb-3">
    <label class="form-label" for="winning-answer">Winning answer</label>
    <textarea id="winning-answer" class="form-control" rows="3" formControlName="winningAnswer"></textarea>
  </div>

  <div class="mb-3">
    <label class="form-label" for="strengths">What was good about it?</label>
    <textarea id="strengths" class="form-control" rows="3" formControlName="strengths"></textarea>
  </div>

  <div class="mb-3">
    <label class="form-label" for="weaknesses">What was missing or weak?</label>
    <textarea id="weaknesses" class="form-control" rows="3" formControlName="weaknesses"></textarea>
  </div>

  <div class="mb-3">
    <label class="form-label" for="useful-from-others">Useful parts from other answers</label>
    <textarea
      id="useful-from-others"
      class="form-control"
      rows="3"
      formControlName="usefulFromOthers"
    ></textarea>
  </div>

  <div class="mb-3">
    <label class="form-label" for="final-answer">Improved final answer</label>
    <textarea id="final-answer" class="form-control" rows="8" formControlName="finalAnswer"></textarea>
  </div>

  <button type="submit" class="btn btn-primary" [disabled]="disabled()">Save improved answer</button>
</form>
