<div class="card card-elevated evaluation-card h-100">
  <div class="card-body d-flex flex-column">
    <h5 class="card-title evaluation-card__title">{{ evaluation().title }}</h5>
    <p class="card-text evaluation-card__prompt text-muted small flex-grow-1">{{ evaluation().prompt }}</p>
    <p class="card-text evaluation-card__meta mb-0">
      <span class="badge evaluation-card__badge">{{ evaluation().answers.length }} answers</span>
    </p>
    <div class="evaluation-card__actions d-flex flex-wrap gap-2 mt-3">
      <a class="btn btn-sm btn-primary" [routerLink]="['/evaluations', evaluation().id, 'edit']">Edit</a>
      <a class="btn btn-sm btn-outline-primary" [routerLink]="['/evaluations', evaluation().id, 'compare']">
        Compare
      </a>
      <a class="btn btn-sm btn-outline-secondary" [routerLink]="['/evaluations', evaluation().id, 'improved']">
        Improved
      </a>
      <button type="button" class="btn btn-sm btn-outline-danger ms-auto" (click)="deleteRequested.emit(evaluation().id)">
        Delete
      </button>
    </div>
  </div>
</div>
