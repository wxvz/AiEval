<div class="card h-100 shadow-sm">
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ evaluation().title }}</h5>
    <p class="card-text text-muted small flex-grow-1">{{ evaluation().prompt }}</p>
    <p class="card-text">
      <span class="badge text-bg-secondary me-1">{{ evaluation().answers.length }} answers</span>
      <span class="badge text-bg-light text-dark">{{ evaluation().updatedAt | date: 'mediumDate' }}</span>
    </p>
    <div class="d-flex flex-wrap gap-2 mt-2">
      <a class="btn btn-sm btn-primary" [routerLink]="['/evaluations', evaluation().id, 'edit']">Edit</a>
      <a class="btn btn-sm btn-outline-primary" [routerLink]="['/evaluations', evaluation().id, 'compare']">
        Compare
      </a>
      <a class="btn btn-sm btn-outline-secondary" [routerLink]="['/evaluations', evaluation().id, 'improved']">
        Improved
      </a>
      <button type="button" class="btn btn-sm btn-outline-danger ms-auto" (click)="deleteRequested.emit(evaluation().id)">
        Delete
      </button>
    </div>
  </div>
</div>
