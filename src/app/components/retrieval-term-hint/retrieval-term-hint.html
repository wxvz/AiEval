<span class="retrieval-term-hint position-relative d-inline">
  <button
    type="button"
    class="retrieval-term-hint__trigger btn btn-link p-0 align-baseline text-decoration-underline text-decoration-style-dotted"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-describedby]="isOpen() ? 'retrieval-hint-' + resolvedId() : null"
    (click)="toggle($event)"
  >
    {{ entry().label }}
  </button>
  @if (isOpen()) {
    <span
      [id]="'retrieval-hint-' + resolvedId()"
      class="retrieval-term-hint__popover"
      role="tooltip"
      (click)="$event.stopPropagation()"
    >
      {{ entry().explanation }}
    </span>
  }
</span>
