<span
  class="learn-term-hint position-relative d-inline"
  [class.learn-term-hint--saved]="isAsideMode() && isSaved()"
>
  @if (isAsideMode() && isSaved()) {
    <span class="learn-term-hint__saved">{{ entry().label }}</span>
  } @else if (isInteractive()) {
    <button
      type="button"
      class="learn-term-hint__trigger btn btn-link p-0 align-baseline"
      [attr.aria-expanded]="!isAsideMode() && isOpen()"
      [attr.aria-describedby]="!isAsideMode() && isOpen() ? 'learn-hint-' + resolvedId() : null"
      (click)="isAsideMode() ? selectTerm($event) : toggle($event)"
    >
      {{ entry().label }}
    </button>
    @if (!isAsideMode() && isOpen()) {
      <span
        [id]="'learn-hint-' + resolvedId()"
        class="learn-term-hint__popover"
        role="tooltip"
        (click)="$event.stopPropagation()"
      >
        {{ entry().explanation }}
      </span>
    }
  } @else {
    <span class="learn-term-hint__plain">{{ entry().label }}</span>
  }
</span>
