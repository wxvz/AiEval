<div
  class="page-shell"
  [class.page-shell--wide-main]="wideMain()"
  [class.page-shell--span-right]="spanRight()"
>
  <aside class="page-shell__left">
    <ng-content select="[shellLeft]" />
  </aside>
  <div class="page-shell__main">
    <ng-content select="[shellMain]" />
  </div>
  <aside class="page-shell__right">
    <ng-content select="[shellRight]" />
  </aside>
</div>
