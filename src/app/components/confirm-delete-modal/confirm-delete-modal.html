<div class="modal fade" [id]="modalId()" tabindex="-1" [attr.aria-labelledby]="modalId() + 'Label'" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" [id]="modalId() + 'Label'">{{ title() }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" (click)="onCancel()"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0">{{ message() }}</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" (click)="onCancel()">Cancel</button>
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal" (click)="onConfirm()">Delete</button>
      </div>
    </div>
  </div>
</div>
