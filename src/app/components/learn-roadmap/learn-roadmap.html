<section class="learn-roadmap" aria-label="Learning progress">
  <p class="learn-roadmap__meta mb-2">
    <span class="learn-roadmap__title">Your path</span>
    <span class="learn-roadmap__sep" aria-hidden="true">·</span>
    <span>{{ completedCount() }} of {{ totalCount }} complete</span>
  </p>

  <div
    class="learn-roadmap__bar progress"
    role="progressbar"
    [attr.aria-valuenow]="completedCount()"
    [attr.aria-valuemin]="0"
    [attr.aria-valuemax]="totalCount"
    [attr.aria-label]="'Learning progress ' + progressPercent() + ' percent'"
  >
    <div class="progress-bar" [style.width.%]="progressPercent()"></div>
  </div>
</section>
