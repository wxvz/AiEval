<nav class="learn-lab-nav learn-sticky-panel" aria-label="Learn navigation">
  @if (resolvedParent(); as parentLesson) {
    <a class="learn-lab-nav__back small" [routerLink]="parentLesson.route">← {{ parentLesson.title }}</a>
  } @else {
    <a class="learn-lab-nav__back small" routerLink="/learn">← Learn</a>
  }

  <button
    type="button"
    class="btn btn-primary btn-sm w-100"
    [disabled]="markCompleteDisabled()"
    [attr.title]="markCompleteTitle()"
    (click)="complete.emit()"
  >
    @if (completed()) {
      Lab completed
    } @else if (locked()) {
      Locked
    } @else {
      Mark lab complete
    }
  </button>

  @if (previousSafe() || nextSafe()) {
    <div class="learn-lab-nav__links">
      @if (previousSafe(); as previous) {
        <a class="small" [routerLink]="previous.route" [attr.title]="previous.hint">← {{ previous.label }}</a>
      }
      @if (nextSafe(); as next) {
        <a class="small" [routerLink]="next.route" [attr.title]="next.hint">{{ next.label }} →</a>
      }
    </div>
  }
</nav>
